<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>リダイレクト中...</title>
    <script>
      // GitHub Pages SPA リダイレクトハック
      // GitHub Pages は SPA のクライアントサイドルーティングに対応していないため、
      // 404.html を利用してリダイレクトを行う
      // 参考: https://github.com/rafgraph/spa-github-pages
      
      var l = window.location;
      // リポジトリ名がパスの最初のセグメントとして存在する場合は segmentCount を 1 にする
      // ルートドメインやカスタムドメインでホストしている場合は 0 になる
      var segmentCount = l.pathname.startsWith('/obsidian-vault-viewer/') ? 1 : 0;
      
      // 404.html 自身へのリダイレクトループを防ぐ
      if (!l.pathname.endsWith('/404.html')) {
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      }
    </script>
  </head>
  <body>
    リダイレクト中...
  </body>
</html>
